<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0912b'/%3E%3Cpath d='M17.5 5 9 18h6l-1.5 9L23 13.5h-6z' fill='%231a1816'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4f0; --panel: #ffffff; --side: #eeebe5; --raised: #ffffff; --hover: rgba(30,25,20,.05);
  --text: #1c1a17; --muted: #77716a; --faint: #a8a29a; --line: #e2ded6; --line-strong: #d3cec4;
  --accent: #e0912b; --accent-ink: #1a1816; --accent-soft: rgba(224,145,43,.13);
  --danger: #c2412d; --danger-soft: rgba(194,65,45,.09); --ok: #2f8a5b;
  --user-bubble: #ebe7e0; --code-bg: #f3f1ec;
  --shadow: 0 1px 2px rgba(20,15,10,.05), 0 6px 24px rgba(20,15,10,.07);
  --serif: Fraunces, Georgia, "Times New Roman", serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --panel-w: 50%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --panel: #1d1c1a; --side: #121110; --raised: #252321; --hover: rgba(255,250,240,.05);
    --text: #ece8e2; --muted: #9c968e; --faint: #6c675f; --line: #2c2a27; --line-strong: #3a3733;
    --accent: #f0a640; --accent-ink: #1a1816; --accent-soft: rgba(240,166,64,.14);
    --danger: #ef7a62; --danger-soft: rgba(239,122,98,.1); --ok: #62c290;
    --user-bubble: #2a2825; --code-bg: #151412;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --panel: #1d1c1a; --side: #121110; --raised: #252321; --hover: rgba(255,250,240,.05);
  --text: #ece8e2; --muted: #9c968e; --faint: #6c675f; --line: #2c2a27; --line-strong: #3a3733;
  --accent: #f0a640; --accent-ink: #1a1816; --accent-soft: rgba(240,166,64,.14);
  --danger: #ef7a62; --danger-soft: rgba(239,122,98,.1); --ok: #62c290;
  --user-bubble: #2a2825; --code-bg: #151412;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
svg { flex-shrink: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 264px minmax(0,1fr) 6px var(--panel-w); height: 100dvh; }
.app.no-project { grid-template-columns: 264px minmax(0,1fr) 0 0; }
.app.no-project .panel, .app.no-project .resizer { display: none; }

/* ---------- sidebar ---------- */
.sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 14px 10px 10px; }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 2px 6px 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -.01em; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.new-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; text-align: left; }
.new-btn:hover { background: var(--hover); }
.new-btn .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.side-label { font-size: 12px; color: var(--faint); padding: 18px 10px 6px; font-weight: 500; }
.proj-list { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
.proj { display: flex; align-items: center; gap: 6px; padding: 7px 6px 7px 10px; border-radius: 8px; cursor: pointer; color: var(--text); text-decoration: none; }
.proj:hover { background: var(--hover); }
.proj.active { background: var(--raised); box-shadow: 0 0 0 1px var(--line); }
.proj .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.proj .pdel { opacity: 0; border: 0; background: none; color: var(--muted); padding: 3px; border-radius: 6px; display: grid; }
.proj:hover .pdel, .proj.active .pdel { opacity: 1; }
.proj .pdel:hover { color: var(--danger); background: var(--danger-soft); }
.proj-empty { color: var(--faint); font-size: 13px; padding: 4px 10px; }
.side-foot { display: flex; align-items: center; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 8px; }
.model-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px; border-radius: 8px; font-size: 13px; color: var(--muted); text-align: left; }
.model-chip:hover { background: var(--hover); color: var(--text); }
.model-chip span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--danger); }
.icon-btn { border: 0; background: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.on { color: var(--text); background: var(--hover); }

/* ---------- main column ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); position: relative; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 54px; }
.title { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
.no-project .title { visibility: hidden; }
.pill-btn { display: none; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--raised); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.only-mobile { display: none; }

.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px 12vh; overflow-y: auto; }
.greet { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4.4vw, 44px); letter-spacing: -.02em; margin: 0 0 8px; text-align: center; display: flex; align-items: center; gap: 14px; }
.greet .logo { width: 38px; height: 38px; border-radius: 11px; }
.sub { color: var(--muted); margin: 0 0 28px; text-align: center; }
.welcome .composer-slot { width: 100%; max-width: 680px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; max-width: 680px; }
.chip { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.chip:hover { color: var(--text); background: var(--raised); }
.banner { max-width: 680px; width: 100%; border: 1px solid var(--line-strong); background: var(--raised); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; font-size: 14px; display: flex; gap: 12px; align-items: flex-start; }
.banner b { font-weight: 600; }
.banner .b-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { opacity: .9; }

.thread { flex: 1; overflow-y: auto; min-height: 0; }
.msgs { max-width: 740px; margin: 0 auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble { background: var(--user-bubble); padding: 10px 15px; border-radius: 18px 18px 6px 18px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.msg.ai { display: flex; gap: 12px; }
.ai-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: 2px; flex-shrink: 0; }
.ai-body { flex: 1; min-width: 0; }
.ai-body > :first-child { margin-top: 0; }
.ai-body p { margin: 0 0 12px; }
.ai-body ul, .ai-body ol { margin: 0 0 12px; padding-left: 22px; }
.ai-body li { margin: 3px 0; }
.ai-body h2, .ai-body h3, .ai-body h4 { font-size: 15.5px; margin: 16px 0 8px; font-weight: 600; }
.ai-body code { font-family: var(--mono); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
.ai-body pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 13px; margin: 0 0 12px; }
.ai-body pre.code code { background: none; border: 0; padding: 0; }
.ai-body a { color: var(--text); text-decoration-color: var(--accent); text-underline-offset: 2px; }
.files-card { border: 1px solid var(--line); background: var(--raised); border-radius: 12px; margin: 4px 0 14px; overflow: hidden; }
.file-chip { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 12px; text-align: left; font-size: 13.5px; }
.file-chip + .file-chip { border-top: 1px solid var(--line); }
.file-chip:hover { background: var(--hover); }
.file-chip .fname { font-family: var(--mono); font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip .fmeta { color: var(--faint); font-size: 12px; }
.file-chip.done svg { color: var(--ok); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.typing { display: flex; gap: 5px; padding: 8px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.err { border: 1px solid var(--danger); background: var(--danger-soft); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; margin-top: 6px; }
.err .btn { margin-top: 8px; }
.note-line { color: var(--faint); font-size: 13px; }
.msg.fix { margin-left: 38px; }
.msg.fix details { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; color: var(--muted); }
.msg.fix summary { cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
.msg.fix summary::-webkit-details-marker { display: none; }
.msg.fix summary svg { color: var(--accent); }
.msg.fix ul { margin: 8px 0 2px; padding-left: 22px; font-family: var(--mono); font-size: 12.5px; }

.composer-wrap { padding: 0 20px 18px; }
.composer-wrap .composer { max-width: 740px; margin: 0 auto; }
.composer { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 18px; padding: 12px 12px 10px 16px; box-shadow: var(--shadow); transition: border-color .15s; }
.composer:focus-within { border-color: var(--faint); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit; font-size: 15.5px; line-height: 1.5; max-height: 240px; min-height: 26px; padding: 2px 0; }
.composer textarea::placeholder { color: var(--faint); }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.hint { flex: 1; font-size: 12px; color: var(--faint); }
.send { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: opacity .15s, transform .15s; }
.send:disabled { opacity: .35; cursor: default; }
.send:not(:disabled):hover { transform: translateY(-1px); }
.send.stop { background: var(--text); color: var(--bg); }

/* ---------- resizer + panel ---------- */
.resizer { cursor: col-resize; background: var(--bg); position: relative; }
.resizer::after { content: ""; position: absolute; inset: 0 2px; background: var(--line); transition: background .15s; }
.resizer:hover::after, .resizer.drag::after { background: var(--accent); }
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.panel-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); min-height: 54px; }
.tabs { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; border: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
.tabs button.active { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.devices { display: flex; gap: 2px; margin-left: auto; }
.panel-actions { display: flex; gap: 2px; padding-left: 6px; border-left: 1px solid var(--line); }
.panel-body { flex: 1; min-height: 0; position: relative; }
.preview-wrap { position: absolute; inset: 0; display: flex; justify-content: center; background: var(--bg); overflow: auto; }
.frame-box { width: 100%; height: 100%; transition: width .25s ease; background: #fff; }
.frame-box.tablet, .frame-box.mobile { margin: 16px 0; height: calc(100% - 32px); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line-strong); }
.frame-box.tablet { width: 768px; max-width: calc(100% - 32px); }
.frame-box.mobile { width: 390px; max-width: calc(100% - 32px); }
.frame-box iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.building { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 14px 6px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow); z-index: 2; }
.code-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.file-tabs { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; align-items: center; }
.file-tabs button.ft { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.file-tabs button.ft.active { background: var(--hover); color: var(--text); }
.file-tabs .copy { margin-left: auto; flex-shrink: 0; }
.code-scroll { flex: 1; overflow: auto; display: flex; background: var(--code-bg); font: 12.8px/1.65 var(--mono); }
.code-scroll pre { margin: 0; padding: 12px 0; }
.gutter { color: var(--faint); text-align: right; padding: 12px 12px 12px 14px !important; user-select: none; position: sticky; left: 0; background: var(--code-bg); border-right: 1px solid var(--line); }
.src { padding: 12px 16px !important; color: var(--text); flex: 1; }
.code-empty { padding: 24px; color: var(--faint); }
.problems { border-top: 1px solid var(--line); background: var(--panel); max-height: 40%; display: flex; flex-direction: column; }
.problems-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; }
.problems-head .ptitle { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
.problems-head .ptitle svg { color: var(--danger); }
.problems ul { margin: 0; padding: 0 12px 10px 32px; overflow-y: auto; font: 12.5px/1.55 var(--mono); color: var(--muted); }
.problems li { margin: 3px 0; }
.problems.collapsed ul { display: none; }

/* ---------- modal & toast ---------- */
.modal { position: fixed; inset: 0; background: rgba(10,8,6,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.sheet { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 16px; width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: center; padding: 16px 18px 6px; }
.sheet-head h2 { flex: 1; margin: 0; font-family: var(--serif); font-weight: 500; font-size: 22px; }
.sheet-body { padding: 8px 18px 4px; display: flex; flex-direction: column; gap: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.field .help { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.field input, .field select { width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.seg button { border: 1px solid var(--line-strong); background: var(--bg); border-radius: 10px; padding: 9px 8px; font-size: 13px; text-align: left; }
.seg button b { display: block; font-weight: 600; font-size: 13.5px; }
.seg button span { color: var(--muted); font-size: 12px; }
.seg button.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.test-out { font-size: 13px; padding: 9px 11px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); white-space: pre-wrap; }
.test-out.ok { border-color: var(--ok); } .test-out.bad { border-color: var(--danger); }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 18px 18px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; transition: all .25s; z-index: 60; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.scrim { display: none; }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .app, .app.no-project { grid-template-columns: minmax(0,1fr); }
  .resizer { display: none; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 40; transform: translateX(-100%); transition: transform .25s ease; }
  .app.side-open .sidebar { transform: none; box-shadow: var(--shadow); }
  .app.side-open .scrim { display: block; position: fixed; inset: 0; background: rgba(10,8,6,.4); z-index: 30; }
  .only-mobile { display: grid; }
  .pill-btn { display: inline-flex; }
  .no-project .pill-btn { display: none; }
  .panel { position: fixed; inset: 0; z-index: 35; border: 0; transform: translateY(100%); transition: transform .28s ease; display: flex !important; }
  .app.no-project .panel { display: none !important; }
  .app.panel-open .panel { transform: none; }
  .devices { display: none; }
  .hint { display: none; }
  .msgs { padding: 8px 16px 20px; }
  .composer-wrap { padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  .msg.fix { margin-left: 0; }
  .seg { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app no-project" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Projects">
    <div class="side-top">
      <div class="brand"><span class="logo" data-logo="16"></span>Forge</div>
      <button class="icon-btn only-mobile" id="closeSide" aria-label="Close menu" data-icon="x"></button>
    </div>
    <button class="new-btn" id="newBtn"><span class="plus" data-icon="plus"></span>New project</button>
    <div class="side-label">Projects</div>
    <nav class="proj-list" id="projList"></nav>
    <div class="side-foot">
      <button class="model-chip" id="modelChip" title="Model settings"><span class="dot" id="modelDot"></span><span id="modelName">Checking model…</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Change theme" data-icon="theme"></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" data-icon="gear"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu" data-icon="menu"></button>
      <h1 class="title" id="title" title="Double-click to rename"></h1>
      <button class="pill-btn" id="previewToggle"><span data-icon="eye"></span>Preview</button>
    </header>

    <section class="welcome" id="welcome">
      <h2 class="greet"><span class="logo" data-logo="22"></span>What should we build?</h2>
      <p class="sub">Describe a website or app. Forge writes it, previews it, and fixes its own errors.</p>
      <div class="banner" id="banner" hidden></div>
      <div class="composer-slot" id="welcomeSlot"></div>
      <div class="chips" id="chips"></div>
    </section>

<script>
/* ======================= icons ======================= */
const P = (d, w = 18) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  plus: P('<path d="M12 5v14M5 12h14"/>', 15),
  x: P('<path d="M6 6l12 12M18 6 6 18"/>'),
  menu: P('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  gear: P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  theme: P('<circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor"/>'),
  up: P('<path d="M12 19V5M5 12l7-7 7 7"/>', 17),
  stop: '<svg width="14" height="14" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>',
  eye: P('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', 15),
  desktop: P('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>', 17),
  tablet: P('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/>', 17),
  phone: P('<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>', 17),
  reload: P('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>', 17),
  external: P('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', 17),
  download: P('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', 17),
  trash: P('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', 15),
  check: P('<path d="M5 12l5 5 9-10"/>', 15),
  wrench: P('<path d="M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-2.3-2.3a4 4 0 0 0-5-5L2 10l8-8z" transform="scale(.9) translate(1.3 1.3)"/>', 15),
  alert: P('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>', 15),
  copy: P('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>', 15),
  spark: P('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>', 14),
};
const LOGO = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M13.6 2.5 5.2 13.4h5.4L9.4 21.5l8.4-10.9h-5.4z" fill="currentColor"/></svg>`;
document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', ICON[el.dataset.icon] || ''));
document.querySelectorAll('[data-logo]').forEach(el => el.innerHTML = LOGO(+el.dataset.logo));

/* ======================= helpers ======================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const json = (r) => { if (r.status === 401) { location.reload(); throw new Error('signed out'); } return r.json(); };
const api = {
  get: (p) => fetch(p).then(json),
  post: (p, b) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }).then(json),
  del: (p) => fetch(p, { method: 'DELETE' }).then(json),
};
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
const isMobile = () => matchMedia('(max-width: 900px)').matches;

/* ======================= state ======================= */
const S = {
  projects: [], pid: null, meta: null, messages: [], files: {},
  settings: {}, health: null,
  generating: false, ctrl: null,
  fixAttempts: 0, runtime: [], problems: [], loadedResolve: null,
  tab: 'preview', device: 'desktop', activeFile: null, live: null,
};

/* ======================= markdown ======================= */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const blocks = [];
  src = src.replace(/```[\w+-]*[ \t]*\n?([\s\S]*?)(```|$)/g, (m, code) => {
    blocks.push(`<pre class="code"><code>${esc(code.replace(/\n$/, ''))}</code></pre>`);
    return `\n\u0000${blocks.length - 1}\u0000\n`;
  });
  let html = '', list = null, para = [];
  const endPara = () => { if (para.length) { html += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const endList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of src.split('\n')) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^\u0000(\d+)\u0000$/))) { endPara(); endList(); html += blocks[+m[1]]; continue; }
    if (!line.trim()) { endPara(); endList(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) { endPara(); endList(); const lv = Math.min(4, m[1].length + 1); html += `<h${lv}>${inline(m[2])}</h${lv}>`; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { endPara(); if (list !== 'ul') { endList(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { endPara(); if (list !== 'ol') { endList(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    endList(); para.push(line);
  }
  endPara(); endList();
  return html;
}

/* ======================= rendering ======================= */
const FILE_RE = /<file\s+path\s*=\s*["']([^"']+)["']\s*>([\s\S]*?)(<\/file>|$)/g;

function renderAI(m) {
  const t = m.content || '';
  let html = '', chips = [], last = 0, mm;
  const flush = () => { if (chips.length) { html += `<div class="files-card">${chips.join('')}</div>`; chips = []; } };
  FILE_RE.lastIndex = 0;
  while ((mm = FILE_RE.exec(t))) {
    const before = t.slice(last, mm.index);
    if (before.trim()) { flush(); html += md(before); }
    const done = !!mm[3];
    const lines = mm[2].replace(/^\n/, '').split('\n').length;
    chips.push(`<button class="file-chip ${done ? 'done' : 'writing'}" data-file="${esc(mm[1])}">
      ${done ? ICON.check : '<span class="spin"></span>'}
      <span class="fname">${esc(mm[1])}</span><span class="fmeta">${done ? lines + ' lines' : 'writing… ' + lines}</span></button>`);
    last = FILE_RE.lastIndex;
    if (!done) { last = t.length; break; }
  }
  let rest = t.slice(last);
  if (m.streaming) rest = rest.replace(/<[^>\n]*$/, '');
  if (rest.trim()) { flush(); html += md(rest); }
  flush();
  if (m.streaming && !t) html += '<div class="typing"><i></i><i></i><i></i></div>';
  if (m.error) html += `<div class="err">${esc(m.error)}<br><button class="btn" data-action="settings">Open settings</button></div>`;
  if (m.stopped) html += '<div class="note-line">Stopped.</div>';
  return html;
}

function msgEl(m) {
  const el = document.createElement('div');
  if (m.role === 'user' && m.auto) {
    const items = m.content.split('\n').filter(l => l.startsWith('- ')).map(l => l.slice(2));
    el.className = 'msg fix';
    el.innerHTML = `<details><summary>${ICON.wrench}<span>Auto-fix: sent ${items.length} problem${items.length === 1 ? '' : 's'} back to the model</span></summary>
      <ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>`;
  } else if (m.role === 'user') {
    el.className = 'msg user';
    el.innerHTML = `<div class="bubble">${esc(m.content)}</div>`;
  } else {
    el.className = 'msg ai';
    el.innerHTML = `<div class="ai-mark">${LOGO(15)}</div><div class="ai-body">${renderAI(m)}</div>`;
  }
  m._el = el;
  return el;
}

function renderMessages() {
  const box = $('#msgs');
  box.innerHTML = '';
  S.messages.forEach(m => box.appendChild(msgEl(m)));
  scrollDown(true);
}

let rafPending = false;
function renderStreaming(m) {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    const near = nearBottom();
    m._el.querySelector('.ai-body').innerHTML = renderAI(m);
    if (near) scrollDown();
    updateLiveFile(m.content);
  });
}
function nearBottom() { const t = $('#thread'); return t.scrollHeight - t.scrollTop - t.clientHeight < 140; }
function scrollDown(force) { const t = $('#thread'); if (force || nearBottom()) t.scrollTop = t.scrollHeight; }

function renderProjects() {
  const list = $('#projList');
  if (!S.projects.length) { list.innerHTML = '<div class="proj-empty">No projects yet</div>'; return; }
  list.innerHTML = S.projects.map(p => `
    <div class="proj ${p.id === S.pid ? 'active' : ''}" data-id="${p.id}" role="button" tabindex="0">
      <span class="pname">${esc(p.title || 'Untitled')}</span>
      <button class="pdel" data-del="${p.id}" aria-label="Delete project">${ICON.trash}</button>
    </div>`).join('');
}

function setView() {
  const has = !!S.pid;
  $('#app').classList.toggle('no-project', !has);
  $('#welcome').hidden = has;
  $('#thread').hidden = !has;
  $('#bottomSlot').hidden = !has;
  (has ? $('#bottomSlot') : $('#welcomeSlot')).appendChild($('#composer'));
  $('#input').placeholder = has ? 'Ask for a change, a new page, or a fix…' : 'Describe the website you want…';
  $('#title').textContent = has ? (S.meta?.title || 'New project') : '';
  document.title = has ? `${S.meta?.title || 'Project'} · Forge` : 'Forge';
  renderProjects();
}

/* ======================= projects ======================= */
async function loadProjects() { S.projects = await api.get('/api/projects'); renderProjects(); }

async function openProject(pid, { keepPanel } = {}) {
  if (S.generating) { toast('Wait for the current reply to finish'); return; }
  const d = await api.get(`/api/projects/${pid}`);
  if (!d || !d.meta) { toast('Project not found'); return; }
  S.pid = pid; S.meta = d.meta; S.messages = d.messages; S.files = d.files;
  S.fixAttempts = 0; S.runtime = []; setProblems([]);
  S.activeFile = null;
  history.replaceState(null, '', `#${pid}`);
  setView(); renderMessages(); renderCode();
  reloadPreview();
  $('#app').classList.remove('side-open');
  if (!keepPanel) $('#app').classList.remove('panel-open');
  $('#input').focus();
}

async function refreshProject() {
  if (!S.pid) return;
  const d = await api.get(`/api/projects/${S.pid}`);
  S.files = d.files; S.meta = d.meta;
  $('#title').textContent = S.meta.title;
  renderCode();
}

function newProject() {
  if (S.generating) return;
  S.pid = null; S.meta = null; S.messages = []; S.files = {};
  history.replaceState(null, '', location.pathname);
  setProblems([]);
  setView();
  $('#app').classList.remove('side-open', 'panel-open');
  $('#input').focus();
}

async function deleteProject(pid) {
  const p = S.projects.find(x => x.id === pid);
  if (!confirm(`Delete "${p?.title || 'this project'}"? Its files will be removed.`)) return;
  await api.del(`/api/projects/${pid}`);
  if (pid === S.pid) newProject();
  await loadProjects();
}

/* ======================= chat ======================= */
async function send(text, kind = 'user') {
  text = text.trim();
  if (!text || S.generating) return;
  if (!S.pid) {
    const p = await api.post('/api/projects', {});
    S.pid = p.id; S.meta = p; S.messages = []; S.files = {};
    history.replaceState(null, '', `#${p.id}`);
    setView(); renderCode(); reloadPreview();
  }
  if (kind === 'user') { S.fixAttempts = 0; setProblems([]); }
  const um = { role: 'user', content: text, auto: kind === 'fix' };
  const am = { role: 'assistant', content: '', streaming: true };
  S.messages.push(um, am);
  $('#msgs').append(msgEl(um), msgEl(am));
  scrollDown(true);
  setGenerating(true);

  S.ctrl = new AbortController();
  let done = null;
  try {
    const r = await fetch(`/api/projects/${S.pid}/chat`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, kind }), signal: S.ctrl.signal,
    });
    if (!r.ok || !r.body) throw new Error(`Server error ${r.status}`);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.t === 'start') { if (ev.title && S.meta) { S.meta.title = ev.title; $('#title').textContent = ev.title; } loadProjects(); }
        else if (ev.t === 'delta') { am.content += ev.v; renderStreaming(am); }
        else if (ev.t === 'error') { am.error = ev.v; }
        else if (ev.t === 'done') { done = ev; am.files = ev.files; am.issues = ev.issues; }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') am.stopped = true;
    else am.error = 'Lost connection to the Forge server. Is server.py still running?\n' + e.message;
  }
  am.streaming = false; S.live = null;
  am._el.querySelector('.ai-body').innerHTML = renderAI(am);
  setGenerating(false);
  await refreshProject();
  loadProjects();
  if (am.error) checkHealth();
  if (done && (done.files.length || done.issues.length)) {
    if (isMobile() && done.files.length && !$('#app').classList.contains('panel-open')) toast('Site updated — tap Preview to see it');
    await verify(done.issues, done.files.length > 0);
  }
}

function setGenerating(on) {
  S.generating = on;
  const b = $('#sendBtn');
  b.classList.toggle('stop', on);
  b.innerHTML = on ? ICON.stop : ICON.up;
  b.setAttribute('aria-label', on ? 'Stop' : 'Send');
  b.disabled = on ? false : !$('#input').value.trim();
  $('#building').hidden = !on;
  $('#buildingText').textContent = 'Writing code…';
  $('#fixBtn').disabled = on;
}

function stop() { if (S.ctrl) S.ctrl.abort(); }

/* ======================= verify & auto-fix ======================= */
async function verify(staticIssues, reload) {
  S.runtime = [];
  if (reload) {
    $('#building').hidden = false; $('#buildingText').textContent = 'Checking the preview…';
    const loaded = new Promise(res => (S.loadedResolve = res));
    reloadPreview();
    await Promise.race([loaded.then(() => sleep(1800)), sleep(9000)]);
    S.loadedResolve = null;
    $('#building').hidden = true;
  }
  const problems = [...new Set([...staticIssues, ...S.runtime])];
  setProblems(problems);
  if (!problems.length) return;
  const max = +S.settings.max_fix_attempts || 3;
  if (S.settings.auto_fix && S.fixAttempts < max) {
    S.fixAttempts++;
    await sleep(400);
    await send(fixPrompt(problems), 'fix');
  } else if (S.settings.auto_fix) {
    $('#ptitle').lastChild.textContent = ` ${problems.length} problem${problems.length > 1 ? 's' : ''} left after ${max} auto-fix attempts`;
  }
}

function fixPrompt(problems) {
  return `[auto-fix] The live preview reported these problems:\n${problems.map(p => '- ' + p).join('\n')}\n\nFind the root cause of each in the current files and fix it. Output only the files you change, complete.`;
}

function setProblems(list) {
  S.problems = list;
  const box = $('#problems');
  box.hidden = !list.length;
  if (!list.length) return;
  $('#ptitle').innerHTML = `${ICON.alert}<span> ${list.length} problem${list.length > 1 ? 's' : ''} found</span>`;
  $('#problemList').innerHTML = list.map(p => `<li>${esc(p)}</li>`).join('');
}

window.addEventListener('message', (e) => {
  if (e.source !== $('#frame').contentWindow || !e.data || !e.data.forge) return;
  const { kind, msg } = e.data;
  if (kind === 'loaded') { if (S.loadedResolve) S.loadedResolve(); return; }
  const label = kind === 'resource' ? msg : kind === 'console' ? 'console.error: ' + msg : msg;
  if (S.loadedResolve) { S.runtime.push(label); return; }
  // errors while the user clicks around the preview: show them, but don't auto-fix
  if (!S.generating && !S.problems.includes(label)) setProblems([...S.problems, label]);
});

/* ======================= preview & code ======================= */
function reloadPreview() {
  if (!S.pid) return;
  $('#frame').src = `/preview/${S.pid}/?t=${Date.now()}`;
}

function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('#previewWrap').hidden = tab !== 'preview';
  $('#codeWrap').hidden = tab !== 'code';
  $('#devices').style.visibility = tab === 'preview' ? 'visible' : 'hidden';
  if (tab === 'code') renderCode();
}

function setDevice(d) {
  S.device = d;
  $('#frameBox').className = 'frame-box ' + d;
  document.querySelectorAll('#devices button').forEach(b => b.classList.toggle('on', b.dataset.device === d));
}

function updateLiveFile(text) {
  FILE_RE.lastIndex = 0;
  let mm, live = null;
  while ((mm = FILE_RE.exec(text))) { if (!mm[3]) { live = { path: mm[1], content: mm[2].replace(/^\n/, '') }; break; } }
  S.live = live;
  if (live && S.tab === 'code') { S.activeFile = live.path; renderCode(true); }
}

function renderCode(follow) {
  const files = { ...S.files };
  if (S.live && !(S.live.path in files)) files[S.live.path] = '';
  const paths = Object.keys(files);
  if (!paths.length) {
    $('#fileTabs').innerHTML = '';
    $('#codeScroll').innerHTML = '<div class="code-empty">No files yet. Ask Forge to build something.</div>';
    return;
  }
  if (!S.activeFile || !(S.activeFile in files)) S.activeFile = paths[0];
  $('#fileTabs').innerHTML = paths.map(p => `<button class="ft ${p === S.activeFile ? 'active' : ''}" data-path="${esc(p)}">${esc(p)}</button>`).join('')
    + `<button class="icon-btn copy" id="copyBtn" aria-label="Copy file">${ICON.copy}</button>`;
  const content = S.live && S.live.path === S.activeFile ? S.live.content : files[S.activeFile];
  const sc = $('#codeScroll');
  if (content === null) { sc.innerHTML = '<div class="code-empty">Binary file — not shown.</div>'; return; }
  const lines = content.replace(/\n$/, '').split('\n');
  sc.innerHTML = `<pre class="gutter">${lines.map((_, i) => i + 1).join('\n')}</pre><pre class="src"><code>${esc(lines.join('\n'))}</code></pre>`;
  if (follow) sc.scrollTop = sc.scrollHeight;
}

/* ======================= settings ======================= */
const PROVIDER_DEFAULTS = {
  ollama: { base: 'http://localhost:11434', help: 'Ollama runs models on your own computer for free. Install it from ollama.com.', modelHelp: 'Pull it first, e.g.  ollama pull qwen2.5-coder:7b' },
  openai: { base: 'https://api.openai.com/v1', help: 'Any OpenAI-compatible server: OpenAI, OpenRouter (https://openrouter.ai/api/v1), Groq, LM Studio (http://localhost:1234/v1), vLLM…', modelHelp: 'The model id your provider uses.' },
  demo: { base: '', help: '', modelHelp: '' },
};
let draftProvider = 'ollama';

function openSettings() {
  const s = S.settings;
  draftProvider = s.provider || 'ollama';
  $('#sBase').value = s.base_url || '';
  $('#sModel').value = s.model || '';
  $('#sKey').value = '';
  $('#sKey').placeholder = s.has_api_key ? 'Saved — leave empty to keep it' : 'sk-…';
  $('#sTemp').value = s.temperature ?? 0.3;
  $('#sCtx').value = s.num_ctx ?? 16384;
  $('#sAuto').checked = !!s.auto_fix;
  $('#sMax').value = s.max_fix_attempts ?? 3;
  $('#testOut').hidden = true;
  setProviderUI(draftProvider, false);
  $('#settingsModal').hidden = false;
}
function setProviderUI(p, changeBase) {
  draftProvider = p;
  document.querySelectorAll('#providerSeg button').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  const d = PROVIDER_DEFAULTS[p];
  if (changeBase) { $('#sBase').value = d.base; if (p === 'ollama' && !$('#sModel').value) $('#sModel').value = 'qwen2.5-coder:7b'; }
  $('#fBase').hidden = $('#fModel').hidden = $('#fTune').hidden = p === 'demo';
  $('#fKey').hidden = p !== 'openai';
  $('#sCtx').disabled = p !== 'ollama';
  $('#baseHelp').textContent = d.help;
  $('#modelHelp').textContent = d.modelHelp;
}
function draftSettings() {
  const o = {
    provider: draftProvider, base_url: $('#sBase').value.trim(), model: $('#sModel').value.trim(),
    temperature: +$('#sTemp').value || 0, num_ctx: +$('#sCtx').value || 16384,
    auto_fix: $('#sAuto').checked, max_fix_attempts: Math.max(1, Math.min(8, +$('#sMax').value || 3)),
  };
  if ($('#sKey').value.trim()) o.api_key = $('#sKey').value.trim();
  return o;
}
async function testConnection() {
  const out = $('#testOut'); out.hidden = false; out.className = 'test-out'; out.textContent = 'Connecting…';
  const r = await api.post('/api/health', draftSettings());
  out.className = 'test-out ' + (r.ok ? 'ok' : 'bad');
  if (r.ok) {
    $('#modelList').innerHTML = r.models.map(m => `<option value="${esc(m)}">`).join('');
    const want = $('#sModel').value.trim();
    const found = !want || r.models.some(m => m === want || m === want + ':latest');
    out.textContent = `Connected. ${r.models.length} model${r.models.length === 1 ? '' : 's'} available.` +
      (draftProvider === 'ollama' && !found ? `\n"${want}" isn't downloaded yet. Run:  ollama pull ${want}` : '');
    if (draftProvider === 'ollama' && !r.models.length) out.textContent += '\nNo models yet. Run:  ollama pull qwen2.5-coder:7b';
  } else out.textContent = r.error;
}
async function saveSettings() {
  S.settings = await api.post('/api/settings', draftSettings());
  $('#settingsModal').hidden = true;
  toast('Settings saved');
  checkHealth();
}

async function checkHealth() {
  const s = S.settings;
  $('#modelName').textContent = s.provider === 'demo' ? 'Demo mode' : (s.model || 'No model');
  const r = await api.get('/api/health');
  S.health = r;
  let ok = r.ok;
  if (ok && s.provider === 'ollama') ok = r.models.some(m => m === s.model || m === s.model + ':latest');
  $('#modelDot').className = 'dot ' + (ok ? 'ok' : 'bad');
  $('#modelChip').title = ok ? 'Model connected' : (r.error || 'Model not downloaded');
  renderBanner(r, ok);
}
function renderBanner(r, ok) {
  const b = $('#banner');
  if (ok) { b.hidden = true; return; }
  const s = S.settings;
  let msg;
  if (s.provider === 'ollama' && r.ok) msg = `<b>${esc(s.model)}</b> isn't downloaded yet. In a terminal run <code>ollama pull ${esc(s.model)}</code>, or try demo mode.`;
  else if (s.provider === 'ollama') msg = `<b>Can't reach Ollama.</b> Install it from ollama.com and open it, or try demo mode to see how Forge works.`;
  else msg = `<b>Can't reach the model API.</b> Check the URL and key in Settings.`;
  b.innerHTML = `<span style="color:var(--accent)">${ICON.alert}</span><div>${msg}<div class="b-actions">
    <button class="btn" data-action="settings">Open settings</button>
    ${s.provider !== 'demo' ? '<button class="btn" data-action="demo">Use demo mode</button>' : ''}
    <button class="btn" data-action="recheck">Check again</button></div></div>`;
  b.hidden = false;
}

/* ======================= theme ======================= */
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t;
  try { localStorage.setItem('forge-theme', t); } catch (_) {}
  $('#themeBtn').title = 'Theme: ' + t;
}

/* ======================= events ======================= */
const input = $('#input');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 240) + 'px'; }
input.addEventListener('input', () => { autosize(); if (!S.generating) $('#sendBtn').disabled = !input.value.trim(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isMobile()) { e.preventDefault(); $('#composer').requestSubmit(); }
});
$('#composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (S.generating) { stop(); return; }
  const t = input.value; if (!t.trim()) return;
  input.value = ''; autosize(); $('#sendBtn').disabled = true;
  send(t);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!$('#settingsModal').hidden) $('#settingsModal').hidden = true;
    else if (S.generating) stop();
  }
});

const SUGGESTIONS = [
  'A landing page for a specialty coffee roaster in Bengaluru',
  'A personal portfolio for a UI designer, with a project grid',
  'A habit tracker app that saves to localStorage',
  'An analytics dashboard with charts for an online store',
];
$('#chips').innerHTML = SUGGESTIONS.map(s => `<button class="chip" data-suggest="${esc(s)}">${ICON.spark}${esc(s.split(',')[0])}</button>`).join('');

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-suggest],[data-action],[data-del],.proj,.file-chip,[data-tab],[data-device],[data-path],#copyBtn');
  if (!t) return;
  if (t.dataset.suggest) { input.value = t.dataset.suggest; autosize(); $('#sendBtn').disabled = false; input.focus(); return; }
  if (t.dataset.action === 'settings') return openSettings();
  if (t.dataset.action === 'recheck') return checkHealth();
  if (t.dataset.action === 'demo') { api.post('/api/settings', { provider: 'demo' }).then(s => { S.settings = s; checkHealth(); toast('Demo mode on — try a suggestion below'); }); return; }
  if (t.dataset.del) { e.stopPropagation(); return deleteProject(t.dataset.del); }
  if (t.classList.contains('proj')) return openProject(t.dataset.id);
  if (t.classList.contains('file-chip')) { S.activeFile = t.dataset.file; setTab('code'); $('#app').classList.add('panel-open'); return; }
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.device) return setDevice(t.dataset.device);
  if (t.dataset.path) { S.activeFile = t.dataset.path; return renderCode(); }
  if (t.id === 'copyBtn') {
    const c = S.live && S.live.path === S.activeFile ? S.live.content : S.files[S.activeFile];
    navigator.clipboard.writeText(c || '').then(() => toast('Copied ' + S.activeFile), () => toast('Copy failed'));
  }
});
$('#projList').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('proj')) openProject(e.target.dataset.id); });

$('#newBtn').onclick = newProject;
$('#settingsBtn').onclick = openSettings;
$('#modelChip').onclick = openSettings;
$('#closeSettings').onclick = () => ($('#settingsModal').hidden = true);
$('#settingsModal').onclick = (e) => { if (e.target.id === 'settingsModal') e.target.hidden = true; };
$('#providerSeg').onclick = (e) => { const b = e.target.closest('button'); if (b) setProviderUI(b.dataset.p, true); };
$('#testBtn').onclick = testConnection;
$('#saveSettings').onclick = saveSettings;
$('#themeBtn').onclick = () => {
  let cur = 'auto'; try { cur = localStorage.getItem('forge-theme') || 'auto'; } catch (_) {}
  applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % 3]);
  toast('Theme: ' + THEMES[(THEMES.indexOf(cur) + 1) % 3]);
};
$('#menuBtn').onclick = () => $('#app').classList.add('side-open');
$('#closeSide').onclick = $('#scrim').onclick = () => $('#app').classList.remove('side-open');
$('#previewToggle').onclick = () => $('#app').classList.add('panel-open');
$('#closePanel').onclick = () => $('#app').classList.remove('panel-open');
$('#reloadBtn').onclick = () => { setProblems([]); reloadPreview(); };
$('#openBtn').onclick = () => S.pid && window.open(`/preview/${S.pid}/`, '_blank');
$('#zipBtn').onclick = () => { if (S.pid) location.href = `/api/projects/${S.pid}/zip`; };
$('#fixBtn').onclick = () => { if (S.problems.length && !S.generating) { S.fixAttempts = 0; send(fixPrompt(S.problems), 'fix'); } };
$('#dismissProblems').onclick = () => setProblems([]);
$('#ptitle').onclick = () => $('#problems').classList.toggle('collapsed');
$('#title').ondblclick = async () => {
  if (!S.pid) return;
  const t = prompt('Rename project', S.meta?.title || '');
  if (t && t.trim()) { S.meta = await api.post(`/api/projects/${S.pid}/rename`, { title: t.trim() }); setView(); loadProjects(); }
};

// drag to resize the preview panel
(() => {
  const r = $('#resizer'); let dragging = false;
  r.addEventListener('pointerdown', (e) => { dragging = true; r.classList.add('drag'); r.setPointerCapture(e.pointerId); $('#frame').style.pointerEvents = 'none'; });
  r.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const w = Math.min(Math.max(window.innerWidth - e.clientX, 320), window.innerWidth - 264 - 360);
    document.documentElement.style.setProperty('--panel-w', w + 'px');
  });
  const end = () => { dragging = false; r.classList.remove('drag'); $('#frame').style.pointerEvents = ''; };
  r.addEventListener('pointerup', end); r.addEventListener('pointercancel', end);
})();

/* ======================= boot ======================= */
(async function boot() {
  let theme = 'auto'; try { theme = localStorage.getItem('forge-theme') || 'auto'; } catch (_) {}
  applyTheme(theme);
  setView();
  S.settings = await api.get('/api/settings');
  checkHealth();
  await loadProjects();
  const hash = location.hash.slice(1);
  if (hash && S.projects.some(p => p.id === hash)) await openProject(hash);
  input.focus();
})();
</script>
